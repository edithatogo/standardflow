name: Primary repository adoption

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/migration/**"
      - "integration/**"
      - "conductor/**"
      - "scripts/check_primary_adoption.py"
      - ".github/workflows/primary-adoption.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/migration/**"
      - "integration/**"
      - "conductor/**"
      - "scripts/check_primary_adoption.py"
      - ".github/workflows/primary-adoption.yml"

permissions:
  contents: read

concurrency:
  group: standardflow-primary-adoption-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/check_primary_adoption.py
